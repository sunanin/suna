<body>
<style id="suna-style">
/* Layout: Banner-Bänder über die volle Breite, Inhalt in einer 1180px-Spalte; Tabellen stehen nebeneinander und scrollen auf dem Handy in ihrer eigenen Karte */
:root{
  --bg:#efe3c8; --paper:#fbf5e8; --paper-2:#f3e4c3; --label:#efd8ab;
  --ink:#3a2618; --ink-soft:#75583b;
  --band:#3e2a1c; --band-ink:#efd6a6;
  --clay:#ab4f26; --clay-ink:#fff7ec;
  --tf:#e6c38b; --tf-ink:#3a2618; --star:#7a3a17;
  --line:#c9a672; --focus:#1d6e78; --danger:#a3321f;
  --veil:rgba(40,26,16,.55);
  --shadow:0 1px 0 rgba(62,42,28,.06),0 10px 28px -16px rgba(62,42,28,.45);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100b; --paper:#231912; --paper-2:#2b1f15; --label:#33251a;
    --ink:#f1e0c3; --ink-soft:#b89a75;
    --band:#0e0906; --band-ink:#e8c58e;
    --clay:#a9491f; --clay-ink:#fff1df;
    --tf:#57402a; --tf-ink:#f5dfb4; --star:#f0b56a;
    --line:#4a3524; --focus:#63b8c2; --danger:#ec8a6c;
    --veil:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16100b; --paper:#231912; --paper-2:#2b1f15; --label:#33251a;
  --ink:#f1e0c3; --ink-soft:#b89a75;
  --band:#0e0906; --band-ink:#e8c58e;
  --clay:#a9491f; --clay-ink:#fff1df;
  --tf:#57402a; --tf-ink:#f5dfb4; --star:#f0b56a;
  --line:#4a3524; --focus:#63b8c2; --danger:#ec8a6c;
  --veil:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banner */
.banner-top{background:var(--band);background:radial-gradient(120% 160% at 50% 0%,color-mix(in srgb,var(--band) 78%,var(--clay)) 0%,var(--band) 62%);color:var(--band-ink)}
.banner-inner{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,34px);padding-block:clamp(14px,2.6vw,26px)}
.banner-inner img{height:clamp(40px,7vw,66px);width:auto;flex:none}
.banner-title{text-align:center;min-width:0}
.kicker{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(11px,1.5vw,13px);letter-spacing:.5em;padding-left:.5em;opacity:.72;margin-bottom:4px}
.banner h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.6vw,42px);letter-spacing:.08em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.banner-sub{background:var(--clay);color:var(--clay-ink)}
.banner-sub .wrap{padding-block:8px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(13px,1.8vw,16px);letter-spacing:.04em}

/* Seite */
.main{display:grid;gap:22px;padding-block:24px 48px}
.main > *{min-width:0}
body.is-editing .main{padding-bottom:128px}

.status{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.stats{display:flex;flex-wrap:wrap;gap:12px 30px;margin:0}
.stats div{display:flex;flex-direction:column-reverse}
.stats dt{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stats dd{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.status-side{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stamp{margin:0;font-size:13px;color:var(--ink-soft)}

.btn{font:inherit;font-size:14px;font-weight:500;line-height:1.2;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn:focus-visible,.cell:focus-visible,.title-input:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--clay);border-color:var(--clay);color:var(--clay-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--paper);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft)}

.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;border:1px solid var(--clay);border-radius:6px;background:var(--paper)}
.notice p{margin:0;max-width:70ch}
.notice-btns{display:flex;flex-wrap:wrap;gap:8px}

/* Befehlsstand: kompakte Leiste, auf breiten Bildschirmen oben angeheftet */
.command{display:grid;gap:10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:15}
@media (min-width:760px){.command{position:sticky;top:env(safe-area-inset-top,0px)}body.is-editing::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}}
.cmd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.cmd-title{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.cmd-field{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cmd-field select,.cmd-field input{font:inherit;font-size:14px;font-weight:500;letter-spacing:normal;text-transform:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.cmd-field select{min-width:190px;max-width:100%}
.cmd-group{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border:1px dashed var(--line);border-radius:6px}
.cmd-group small{margin-right:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cmd-group .btn{padding:6px 10px}
.cmd-group .sq{min-width:32px;padding-inline:0;font-weight:700;font-size:16px;line-height:1}
.cmd-hint{font-size:12px;color:var(--ink-soft)}
.command .stepper .btn{width:32px;padding:6px 0}
.command .stepper input{width:46px;padding:6px 4px}
.cmd-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.cmd-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.cmd-head p{margin:0;font-size:13px;color:var(--ink-soft);max-width:70ch}
.cmd-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.field{display:grid;gap:5px;min-width:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.field select,.field input{font:inherit;font-size:15px;font-weight:500;letter-spacing:normal;text-transform:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.field select{min-width:240px;max-width:100%}
.stepper{display:flex}
.stepper .btn{width:38px;padding-inline:0;font-size:17px;font-weight:700}
.stepper .btn:first-child{border-radius:6px 0 0 6px}
.stepper .btn:last-child{border-radius:0 6px 6px 0}
.stepper input{width:58px;text-align:center;border-radius:0;border-inline:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px}
.group > span{margin-right:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.new-table{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.new-table .field{flex:1 1 240px}

/* Tabellen */
/* Kachel-Raster: am PC frei anordenbar, am Handy untereinander */
.board{position:relative}
.board.flow{display:flex;flex-direction:column;gap:22px}
.board.flow .card{width:100%}
.board.grid .card{position:absolute;margin:0;transition:left .18s ease,top .18s ease}
.board.noanim .card{transition:none!important}
.board.grid .card.dragging{transition:none;z-index:40;opacity:.96;cursor:grabbing;box-shadow:0 16px 38px rgba(40,20,5,.38)}
.board.is-dragging{user-select:none;-webkit-user-select:none}
.drop-ghost{position:absolute;z-index:0;border:2px dashed var(--focus);border-radius:6px;background:color-mix(in srgb,var(--focus) 12%,transparent);pointer-events:none;transition:left .12s ease,top .12s ease,width .12s ease,height .12s ease}
.grip{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:none;place-items:center;width:30px;height:30px;padding:0;border-radius:6px;border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);cursor:grab;touch-action:none}
.grip svg{width:16px;height:16px}
.grip:hover{background:color-mix(in srgb,var(--band-ink) 14%,transparent)}
.grip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.is-editing .board.grid .grip{display:inline-grid}
.cmd-order{display:none}
.card{flex:0 1 auto;min-width:0;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.is-editing .card.is-selected{outline:2px solid var(--focus);outline-offset:3px}
.card-head{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 44px;background:var(--band);color:var(--band-ink)}
.fill{padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;background:color-mix(in srgb,var(--band-ink) 18%,transparent);color:var(--band-ink)}
.head-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-radius:6px;border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);background:transparent;color:var(--band-ink);cursor:pointer}
.head-btn svg{width:15px;height:15px}
.head-btn:hover{background:color-mix(in srgb,var(--band-ink) 14%,transparent)}
.head-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card-head svg{width:18px;height:18px;flex:none}
.card-head h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.title-input{width:min(280px,100%);min-width:0;padding:3px 8px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--band-ink);background:transparent;border:1px dashed color-mix(in srgb,var(--band-ink) 45%,transparent);border-radius:4px}
.title-input::placeholder{color:var(--band-ink);opacity:.5}
.scroll{overflow-x:auto}
.grid{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.grid th,.grid td{padding:7px 14px;min-width:124px;text-align:center;white-space:nowrap;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid th{position:sticky;left:0;z-index:1;min-width:108px;font-weight:700}
.grid tr > :last-child{border-right:0}
.grid th,.grid td{height:40px}
.grid tbody tr:last-child > *{border-bottom:0}

  /* ---------- Einteilung & Auswahlliste ---------- */
  function assignments(s) {

      const add = (n, tf, key) => {
        const k = fold(n);
        if (!k) return;
        if (!map.has(k)) map.set(k, []);
        map.get(k).push({ table: tname(t), trupp: tr.name.trim() || "Trupp " + (i + 1), tf, key });
      };

  function comboRender() {

  const ICONS = {

  function stats(s) {
    const count = new Map();
    let trupps = 0, slots = 0, filled = 0;
    s.tables.forEach((t) => {
      trupps += t.trupps.length;
      t.trupps.forEach((tr) => [tr.tf].concat(tr.members).forEach((n) => {
        slots++;
        const k = fold(n);
        if (k) { filled++; count.set(k, (count.get(k) || 0) + 1); }
      }));
    });
    let dup = 0;
    count.forEach((v) => { if (v > 1) dup++; });
    return { members: s.members.length, tables: s.tables.length, trupps, names: count.size, free: slots - filled, dup };
  }

  // Doppelt eingeteilte und unbekannte Namen markieren
  let marks = { dup: new Set(), known: new Set() };
  function computeMarks(s) {
    if (!showStats()) { marks = { dup: new Set(), known: new Set() }; return; }
    const count = new Map();
    s.tables.forEach((t) => t.trupps.forEach((tr) => [tr.tf].concat(tr.members).forEach((n) => { const k = fold(n); if (k) count.set(k, (count.get(k) || 0) + 1); })));
    const dup = new Set();
    count.forEach((v, k) => { if (v > 1) dup.add(k); });
    marks = { dup, known: new Set(s.members.map((mm) => fold(mm.name)).filter(Boolean)) };
  }
  const markCls = (v) => { const k = fold(v); if (!k || !showStats()) return ""; return (marks.dup.has(k) ? " dup" : "") + (marks.known.has(k) ? "" : " unknown"); };
  const markTitle = (v) => { const k = fold(v); if (!k || !showStats()) return ""; const t = []; if (marks.dup.has(k)) t.push("Doppelt eingeteilt"); if (!marks.known.has(k)) t.push("Nicht in der Mitgliederliste"); return t.join(" · "); };
  const nameSpan = (v) => { const tt = markTitle(v); return `<span class="nm${markCls(v)}"${tt ? ` title="${esc(tt)}"` : ""}>${esc(v)}</span>`; };
  const fillOf = (t) => { let f = 0; t.trupps.forEach((tr) => [tr.tf].concat(tr.members).forEach((n) => { if (fold(n)) f++; })); return { f, all: t.trupps.length * (t.rows + 1) }; };

  function refreshMarks() {

  // Text für Discord

    // Hintergrund mit warmem Schein oben

    g.beginPath();
    g.moveTo(cx - 9, cy - 17); g.bezierCurveTo(cx - 9, cy - 5, cx + 9, cy - 4, cx + 9, cy + 17);
    g.moveTo(cx + 9, cy - 17); g.bezierCurveTo(cx + 9, cy - 5, cx - 9, cy - 4, cx - 9, cy + 17);
    g.moveTo(cx - 8, cy + 17); g.lineTo(cx + 8, cy + 17);

    {

          text("EINHEIT", x + half + half / 2, yy + 22, `500 12px ${F_BODY}`, DK.muted, "center", 3.4);
          text(fmtTime(cd.time), x + half / 2, yy + 52, fit(fmtTime(cd.time), half - 30, 23, 700, F_BODY, 13), DK.cream, "center");
          text(cd.unit, x + half + half / 2, yy + 52, fit(cd.unit, half - 30, 23, 700, F_BODY, 13), DK.cream, "center");
          g.strokeStyle = DK.line; g.beginPath(); g.moveTo(Math.round(x + half) + 0.5, yy); g.lineTo(Math.round(x + half) + 0.5, yy + INFOH); g.stroke();
          yy += INFOH; hline(x, x + CW, yy - 1, DK.line);
          // Truppführer
          const tg = g.createLinearGradient(x, yy, x + CW, yy);
          tg.addColorStop(0, DK.tfA); tg.addColorStop(1, DK.tfB);
          g.fillStyle = tg; g.fillRect(x, yy, CW, TFH);
          text("TRUPPFÜHRER", x + 25, yy + 18, `500 12px ${F_BODY}`, DK.muted, "left", 3.4);
          const tfName = cd.tf || "— frei —";
          const badgeW = 118;
          text(tfName, x + 25, yy + 44, fit(tfName, CW - 50 - (cd.tf ? badgeW + 16 : 0), 21, 700, F_BODY, 13), cd.tf ? DK.gold : DK.faint, "left");
          if (cd.tf) {
            rr(x + CW - 25 - badgeW, yy + TFH / 2 - 12, badgeW, 24, 12); g.strokeStyle = DK.goldDim; g.lineWidth = 1.2; g.stroke();
            text("★  LEITUNG", x + CW - 25 - badgeW / 2, yy + TFH / 2 + 1, `500 12px ${F_BODY}`, DK.gold, "center", 2.6);
          }
          yy += TFH; hline(x, x + CW, yy - 1, DK.line);
          // Mitglieder
          cd.members.forEach((m, i) => {
            const ry = yy + i * ROWH;
            if (i % 2) { g.fillStyle = "rgba(255,255,255,.012)"; g.fillRect(x, ry, CW, ROWH); }
            g.strokeStyle = m ? DK.goldDim : DK.cardLine; g.lineWidth = 1.2; g.beginPath(); g.arc(x + 40, ry + ROWH / 2, 15, 0, Math.PI * 2); g.stroke();
            text(String(i + 1), x + 40, ry + ROWH / 2 + 1, `400 14px ${F_BODY}`, m ? DK.cream : DK.muted, "center");
            if (m) text(m, x + 73, ry + ROWH / 2 + 1, fit(m, CW - 100, 19, 500, F_BODY, 13), DK.cream, "left");
            else text("— frei —", x + 73, ry + ROWH / 2 + 1, `italic 400 19px ${F_BODY}`, DK.faint, "left");
            if (i < cd.members.length - 1) hline(x, x + CW, ry + ROWH - 1, DK.line);
          });
        } else {
          cd.slots.forEach((sl, i) => {
            const ry = yy + i * SLOTH;
            text(fmtTime(sl.time), x + 28, ry + SLOTH / 2 + 1, `700 19px ${F_BODY}`, DK.cream, "left");
            text(sl.trupp || "— offen —", x + CW - 28, ry + SLOTH / 2 + 1, sl.trupp ? `700 19px ${F_BODY}` : `italic 400 18px ${F_BODY}`, sl.trupp ? DK.gold : DK.faint, "right");
            if (i < cd.slots.length - 1) hline(x, x + CW, ry + SLOTH - 1, DK.line);
          });
        }
        g.restore();
        rr(x + 0.5, y + 0.5, CW - 1, h - 1, 18); g.strokeStyle = DK.cardLine; g.lineWidth = 1.2; g.stroke();
      });
    }

    // Fußzeile: belegte Mitglieder-Plätze und Stand
    let slots = 0, filled = 0;
    cards.forEach((cd) => { if (cd.kind === "trupp") { slots += cd.members.length; filled += cd.members.filter(Boolean).length; } });
    const fy = H - FOOT / 2 + 4;
    if (slots) text(`${filled} / ${slots} Plätze belegt`, M + 2, fy, `400 15px ${F_BODY}`, DK.muted, "left");
    text("Stand: " + fmt(new Date().toISOString()), W - M - 2, fy, `400 15px ${F_BODY}`, DK.muted, "right");

    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("png"))), "image/png"));
  }

  function imageName(which) {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const s = cur();
    const base = which === "all" ? "Dienstplan" : which === "training" ? "Training" : tname(s.tables.find((t) => t.id === which) || s.tables[0]);
    return `Suna_${base.replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g, "_").replace(/^_+|_+$/g, "")}_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.png`;
  }

  function copyImage(which) {
    const png = makePng(which);
    let started = false;
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        started = true;
        navigator.clipboard.write([new ClipboardItem({ "image/png": png })])
          .then(() => toast("Bild kopiert. In Discord einfach mit Strg + V einfügen."))
          .catch(() => showImage(which, png));
      }
    } catch (e) { started = false; }
    if (!started) showImage(which, png);
  }

  async function showImage(which, png) {
    let blob;
    try { blob = await png; } catch (e) { toast("Das Bild konnte nicht erstellt werden."); return; }
    if (ui.img && ui.img.url) URL.revokeObjectURL(ui.img.url);
    ui.img = { blob, url: URL.createObjectURL(blob), name: imageName(which) };
    ui.modal = { title: "Bild für Discord", text: "Direkt kopieren klappt hier nicht. Kopiere das Bild mit Rechtsklick → „Bild kopieren“ oder speichere es und lade es in Discord hoch.", image: ui.img.url, which };
    render();
  }

  async function saveImage() {
    const img = ui.img;
    if (!img) return;
    try {
      const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: img.name, data: img.blob }); toast("Bild gespeichert."); return; }
    } catch (e) {
      if (e && (e.code === "declined" || e.code === "rate_limited")) return;
    }
    try {
      const a = document.createElement("a");
      a.href = img.url; a.download = img.name;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("Speichern geht hier nicht. Nutze Rechtsklick → „Bild speichern unter“."); }
  }

      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Kopiert. Du kannst den Plan jetzt in Discord einfügen."), fallback);

    const names = Array.from(new Set(s.tables[0].trupps.map((t) => t.name.trim()).filter(Boolean)));
    const times = Array.from(new Set(["17–19 Uhr", "19–21 Uhr", "21–23 Uhr", "23–01 Uhr", "01–03 Uhr"]
      .concat(s.tables.reduce((a, t) => a.concat(t.trupps.map((tr) => tr.time.trim())), []), s.training.map((x) => x.time.trim())).filter(Boolean)));
    return `<datalist id="trupp-list">${names.map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist><datalist id="time-list">${times.map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;
  }

  const savebarHtml = () =>
    `<div class="savebar" role="region" aria-label="Speichern"><div class="wrap savebar-in"><p id="save-state" aria-live="polite"></p><div class="savebar-btns"><button class="btn ghost" type="button" data-act="undo" title="Strg + Z">Rückgängig</button><button class="btn ghost" type="button" data-act="discard">Verwerfen</button><button class="btn primary" type="button" data-act="save" title="Strg + S">Speichern</button></div></div></div>`;

  function modalHtml() {
    const m = ui.modal;
    if (!m) return "";
    if (m.signup) {
      const g = m.signup;
      return `<div class="modal-back" data-act="modal-back"><form class="modal" id="su-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">Zum Dienst melden</h3><p>Trag deinen Vor- und Nachnamen ein. Du erscheinst dann in der Liste „Im Dienst“ und wirst von der Leitung eingeteilt.</p>`
        + `<label class="field" for="su-name">Vor- und Nachname<input id="su-name" maxlength="40" autocomplete="name" spellcheck="false" placeholder="z. B. Hokei Motome" value="${esc(g.name)}" required data-autofocus></label>`
        + `<p class="login-err" role="alert"${g.error ? "" : " hidden"}>${esc(g.error || "")}</p><div class="modal-btns"><button class="btn" type="button" data-act="modal-cancel">Abbrechen</button><button class="btn primary" type="submit" id="su-btn">Melden</button></div></form></div>`;
    }
    if (m.signout) {
      const list = ui.signups.length
        ? `<ul class="hist-list">${ui.signups.map((x) => `<li><span><b>${esc(x.name)}</b></span><button class="btn danger" type="button" data-act="so-do" data-id="${x.id}">Abmelden</button></li>`).join("")}</ul>`
        : '<p class="muted">Du hast niemanden zum Dienst gemeldet.</p>';
      return `<div class="modal-back" data-act="modal-back"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">Vom Dienst abmelden</h3><p>Hier siehst du nur deine eigenen Meldungen.</p>${list}<div class="modal-btns"><button class="btn primary" type="button" data-act="modal-cancel" data-autofocus>Schließen</button></div></div></div>`;
    }
    if (m.assign) {
      const g = m.assign, n = ui.duty.length;
      const opts = saved.tables.map((t) => `<option value="${esc(t.id)}"${t.id === g.table ? " selected" : ""}>${esc(tname(t))} · ${freeMemberSlots(t)} frei</option>`).join("");
      const ex = g.mode === "existing";
      return `<div class="modal-back" data-act="modal-back"><form class="modal tall" id="as-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">Zufällig einteilen</h3><p><b>${plural(n, "Person", "Personen")}</b> im Dienst werden zufällig auf freie Mitglieder-Plätze verteilt. Truppführer bleiben leer. Der vorherige Stand landet unter „Ältere Stände“.</p>`
        + `<label class="chk"><input type="radio" name="as-mode" value="existing"${ex ? " checked" : ""}><span><b>Bestehende Tabelle</b><small>Füllt nur freie Plätze. Wer dort schon steht, wird übersprungen.</small></span></label>`
        + `<fieldset class="perm-box" id="as-existing"${ex ? "" : " disabled"}><label class="field" for="as-table">Tabelle<select id="as-table">${opts}</select></label></fieldset>`
        + `<label class="chk"><input type="radio" name="as-mode" value="new"${ex ? "" : " checked"}><span><b>Eigene Tabelle</b><small>Legt eine neue Tabelle an und teilt alle dort ein.</small></span></label>`
        + `<fieldset class="perm-box" id="as-new"${ex ? " disabled" : ""}><label class="field" for="as-title">Name der Tabelle<input id="as-title" maxlength="40" placeholder="Zufällige Einteilung" value="${esc(g.title)}"></label>`
        + `<label class="field" for="as-trupps">Anzahl Trupps<input id="as-trupps" type="number" min="1" max="30" value="${g.trupps}"></label>`
        + `<label class="field" for="as-rows">Mitglieder pro Trupp<input id="as-rows" type="number" min="1" max="60" value="${g.rows}"></label>`
        + `<p class="muted" id="as-cap">${assignCapText(g.trupps, g.rows)}</p></fieldset>`
        + `<p class="login-err" role="alert"${g.error ? "" : " hidden"}>${esc(g.error || "")}</p><div class="modal-btns"><button class="btn" type="button" data-act="modal-cancel">Abbrechen</button><button class="btn primary" type="submit" id="as-btn">Einteilen</button></div></form></div>`;
    }
    if (m.passwd) {
      const g = m.passwd;
      return `<div class="modal-back" data-act="modal-back"><form class="modal" id="pw-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">Passwort ändern</h3><p>Danach bleibst du hier angemeldet, auf allen anderen Geräten wirst du abgemeldet.</p>`
        + `<label class="field" for="pw-old">Aktuelles Passwort<input id="pw-old" name="old" type="password" autocomplete="current-password" required data-autofocus></label>`
        + `<label class="field" for="pw-new">Neues Passwort (mindestens 6 Zeichen)<input id="pw-new" name="new" type="password" autocomplete="new-password" minlength="6" required></label>`
        + `<label class="field" for="pw-new2">Neues Passwort wiederholen<input id="pw-new2" name="new2" type="password" autocomplete="new-password" minlength="6" required></label>`
        + `<p class="login-err" role="alert"${g.error ? "" : " hidden"}>${esc(g.error || "")}</p><div class="modal-btns"><button class="btn" type="button" data-act="modal-cancel">Abbrechen</button><button class="btn primary" type="submit">Ändern</button></div></form></div>`;
    }
    if (m.user) {
      const u = m.user, a = ui.adm;
      const isNew = u.id == null;
      const adm = u.role === "admin";
      const checks = a.perms.map((p) => `<label class="chk"><input type="checkbox" name="perm" value="${esc(p.key)}"${u.perms.indexOf(p.key) !== -1 || adm ? " checked" : ""}${adm ? " disabled" : ""}><span><b>${esc(p.label)}</b><small>${esc(p.hint)}</small></span></label>`).join("");
      const self = ui.me.user && u.id === ui.me.user.id;
      return `<div class="modal-back" data-act="modal-back"><form class="modal tall" id="user-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">${isNew ? "Neues Konto" : esc(u.username)}</h3>`
        + `<label class="field" for="u-name">Benutzername<input id="u-name" name="username" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" required value="${esc(u.username)}"${isNew ? " data-autofocus" : ""}></label>`
        + `<label class="field" for="u-pw">${isNew ? "Passwort (mindestens 6 Zeichen)" : "Neues Passwort setzen (leer lassen = unverändert)"}<input id="u-pw" name="password" type="password" autocomplete="new-password" ${isNew ? "required " : ""}minlength="6"></label>`
        + `<label class="chk"><input type="checkbox" name="isadmin"${adm ? " checked" : ""}><span><b>Administrator</b><small>Darf alles, auch Konten verwalten.</small></span></label>`
        + `<fieldset class="perm-box"><legend>Das darf dieses Konto</legend>${checks}</fieldset>`
        + (isNew ? "" : `<label class="chk"><input type="checkbox" name="active"${u.active ? " checked" : ""}><span><b>Konto aktiv</b><small>Gesperrte Konten können sich nicht anmelden.</small></span></label>`)
        + `<p class="login-err" role="alert"${u.error ? "" : " hidden"}>${esc(u.error || "")}</p><div class="modal-btns">${isNew || self ? "" : '<button class="btn danger push" type="button" data-act="user-del">Konto löschen</button>'}<button class="btn" type="button" data-act="modal-cancel">Abbrechen</button><button class="btn primary" type="submit">${isNew ? "Konto anlegen" : "Speichern"}</button></div></form></div>`;
    }
    if (m.history) {
      const items = m.history.length
        ? `<ul class="hist-list">${m.history.map((h) => `<li><span>${esc(fmt(h.saved_at))} · Version ${h.version}</span><button class="btn" type="button" data-act="hist-load" data-id="${h.id}">In den Editor laden</button></li>`).join("")}</ul>`
        : '<p class="muted">Es gibt noch keine älteren Stände. Sie entstehen bei jedem Speichern.</p>';
      return `<div class="modal-back" data-act="modal-back"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">Ältere Stände</h3><p>Die letzten 30 gespeicherten Stände. Ein geladener Stand gilt erst, wenn du ihn speicherst.</p>${items}<div class="modal-btns"><button class="btn primary" type="button" data-act="modal-cancel" data-autofocus>Schließen</button></div></div></div>`;
    }
    if (m.image) return `<div class="modal-back" data-act="modal-back"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">${esc(m.title)}</h3><p>${esc(m.text)}</p><div class="shot-wrap"><img class="shot" src="${m.image}" alt="Vorschau des Bildes für Discord"></div><div class="modal-btns"><button class="btn" type="button" data-act="copy-text" data-tid="${esc(m.which)}">Als Text kopieren</button><button class="btn" type="button" data-act="save-img">Bild speichern</button><button class="btn primary" type="button" data-act="modal-cancel" data-autofocus>Schließen</button></div></div></div>`;
    if (m.area != null) return `<div class="modal-back" data-act="modal-back"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">${esc(m.title)}</h3><p>${esc(m.text)}</p><textarea class="copy-area" id="copy-area" readonly rows="12" aria-label="Text zum Kopieren">${esc(m.area)}</textarea><div class="modal-btns"><button class="btn primary" type="button" data-act="modal-cancel" data-autofocus>Schließen</button></div></div></div>`;
    return `<div class="modal-back" data-act="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title">${esc(m.title)}</h3><p>${esc(m.text)}</p><div class="modal-btns"><button class="btn" type="button" data-act="modal-cancel" data-autofocus>Abbrechen</button>${m.alt ? `<button class="btn" type="button" data-act="modal-alt">${esc(m.alt.label)}</button>` : ""}<button class="btn danger-solid" type="button" data-act="modal-ok">${esc(m.ok)}</button></div></div></div>`;
  }

  function tabsHtml(s) {
    const t = (id, label, extra) => `<button class="tab" type="button" role="tab" id="tabbtn-${id}" aria-selected="${ui.tab === id}" data-act="tab:${id}">${label}${extra || ""}</button>`;
    return `<nav class="tabs" aria-label="Bereiche"><div class="wrap tabs-in" role="tablist">${t("plan", "Dienstpläne")}${canMembersTab() ? t("members", "Mitglieder", ` <span class="count">${s.members.length}</span>`) : ""}${isAdmin() ? t("bracket", "Turnierbaum") : ""}${isAdmin() ? t("admin", "Admin") : ""}</div></nav>`;
  }

  const planHtml = (s) => `${EP() ? commandHtml(s) : ""}<div class="plan-wrap"><div class="plan-main"><section class="board flow" id="board" aria-label="Dienstpläne">${s.tables.map(tableHtml).join("")}${trainingHtml(s)}</section></div><div class="duty-slot" id="duty-slot">${dutyHtml(s)}</div></div><p class="legend"><span class="star" aria-hidden="true">★</span> = Truppführer (TF)${showStats() ? ' · <span class="nm dup">rot</span> = doppelt eingeteilt · <span class="nm unknown">kursiv</span> = nicht in der Mitgliederliste' : ""}</p>`;

  function chipsHtml(s) {
    const rankChips = RANKS.map((r) => [r, s.members.filter((mm) => mm.rank === r).length]).filter(([, n]) => n > 0)
      .map(([r, n]) => `<button class="chip" type="button" data-act="mrank" data-v="${esc(r)}" aria-pressed="${ui.mrank === r}">${esc(r)} <b>${n}</b></button>`).join("");
    const deptChips = DEPTS.map((d) => [d, s.members.filter((mm) => mm.dept === d).length])
      .map(([d, n]) => `<button class="chip" type="button" data-act="mdept" data-v="${esc(d)}" aria-pressed="${ui.mdept === d}">${esc(d)} <b>${n}</b></button>`).join("")
      + `<button class="chip" type="button" data-act="mdept" data-v="-" aria-pressed="${ui.mdept === "-"}">Ohne Abteilung <b>${s.members.filter((mm) => !mm.dept).length}</b></button>`;
    return `<div class="chip-row"><span>Ränge</span>${rankChips || '<span class="muted">–</span>'}</div><div class="chip-row"><span>Abteilungen</span>${deptChips}</div>`;
  }

  const rankOpts = (sel) => RANKS.map((r) => `<option value="${esc(r)}"${r === sel ? " selected" : ""}>${esc(r)}</option>`).join("");
  const deptOpts = (sel, none) => `<option value="">${esc(none)}</option>` + DEPTS.map((d) => `<option value="${esc(d)}"${d === sel ? " selected" : ""}>${esc(d)}</option>`).join("");

  function memberListHtml(s) {
    const e = EM();
    const assign = assignments(s);
    const q = fold(ui.mq);
    const list = s.members.filter((mm) =>
      (!q || fold(mm.name).includes(q))
      && (!ui.mrank || mm.rank === ui.mrank)
      && (!ui.mdept || (ui.mdept === "-" ? !mm.dept : mm.dept === ui.mdept))
      && (!ui.massign || (ui.massign === "yes") === assign.has(fold(mm.name)))
    ).sort(ui.msort === "name" ? byName : byRank);
    if (!list.length) {
      const msg = s.members.length ? "Kein Mitglied passt zu Suche und Filter." : (e ? "Noch keine Mitglieder. Trag oben den ersten Namen ein." : "Noch keine Mitglieder. Mit „Bearbeiten“ kannst du welche hinzufügen.");
      return `<div class="m-card"><p class="empty">${esc(msg)}</p></div>`;
    }
    const adm = isAdmin();
    const dst = new Map();
    if (adm) ui.dutyStats.forEach((x) => dst.set(fold(x.name), x));
    const dcells = (mm) => { if (!adm) return ""; const x = dst.get(fold(mm.name)); return `<td class="num">${x ? x.in : 0}</td><td class="num">${x ? x.out : 0}</td><td class="last">${x && x.last ? esc(fmt(x.last)) : '<span class="muted">–</span>'}</td>`; };
    const rows = list.map((mm) => {
      const where = assign.get(fold(mm.name)) || [];
      const w = where.length ? esc(whereText(where)) : '<span class="muted">nicht eingeteilt</span>';
      const label = mm.name.trim() || "Mitglied";
      if (e) {
        return `<tr><td><input class="m-input" type="text" data-mid="${esc(mm.id)}" data-mf="name" value="${esc(mm.name)}" aria-label="Name" maxlength="40" autocomplete="off" spellcheck="false"></td>`
          + `<td><select class="m-select" data-mid="${esc(mm.id)}" data-mf="rank" aria-label="Rang von ${esc(label)}">${rankOpts(mm.rank)}</select></td>`
          + `<td><select class="m-select" data-mid="${esc(mm.id)}" data-mf="dept" aria-label="Abteilung von ${esc(label)}">${deptOpts(mm.dept, "– keine –")}</select></td>`
          + `<td class="where">${w}</td>` + dcells(mm)
          + `<td><button class="icon-btn" type="button" data-act="m-del" data-mid="${esc(mm.id)}" aria-label="${esc(label)} entfernen" title="Entfernen">${ICONS.trash}</button></td></tr>`;
      }
      return `<tr><td class="m-name">${esc(mm.name)}</td><td><span class="rank r${rankIdx(mm.rank)}">${esc(mm.rank)}</span></td><td>${mm.dept ? esc(mm.dept) : '<span class="muted">–</span>'}</td><td class="where">${w}</td>${dcells(mm)}</tr>`;
    }).join("");
    return `<p class="m-count">${list.length === s.members.length ? plural(list.length, "Mitglied", "Mitglieder") : `${list.length} von ${s.members.length} Mitgliedern`}</p><div class="m-card"><div class="scroll"><table class="mtable"><thead><tr><th scope="col">Name</th><th scope="col">Rang</th><th scope="col">Abteilung</th><th scope="col">Eingeteilt</th>${adm ? '<th scope="col" title="Wie oft sich diese Person zum Dienst gemeldet hat">Gemeldet</th><th scope="col" title="Wie oft sich diese Person wieder abgemeldet hat">Abgemeldet</th><th scope="col">Zuletzt gemeldet</th>' : ""}${e ? '<th scope="col"><span class="sr">Entfernen</span></th>' : ""}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  function membersHtml(s) {
    const e = EM();
    const nameField = ui.bulk
      ? `<label class="field grow" for="m-new-names">Mehrere Mitglieder (ein Name pro Zeile)<textarea id="m-new-names" rows="4" placeholder="Kohei Sunagase&#10;Akira Sato" spellcheck="false"></textarea></label>`
      : `<label class="field grow" for="m-new-name">Neues Mitglied<input id="m-new-name" maxlength="40" placeholder="Vor- und Nachname" autocomplete="off" spellcheck="false"></label>`;
    const add = e ? `<form class="m-add" id="m-add-form">${nameField}<label class="field" for="m-new-rank">Rang<select id="m-new-rank">${rankOpts(ui.newRank)}</select></label><label class="field" for="m-new-dept">Abteilung<select id="m-new-dept">${deptOpts(ui.newDept, "– keine –")}</select></label><button class="btn primary" type="submit">${ui.bulk ? "Alle hinzufügen" : "Hinzufügen"}</button><button class="btn" type="button" data-act="m-bulk">${ui.bulk ? "Einzeln eingeben" : "Mehrere auf einmal"}</button></form>` : "";
    return `<section class="mpanel" aria-labelledby="m-title">
      <div class="m-head"><h2 id="m-title">Mitgliederliste</h2><p>${e ? "Rang und Abteilung änderst du direkt in der Liste. Entfernte Mitglieder werden auch aus den Dienstplänen genommen." : "Alle Shinobi im Militär von Suna mit Rang, Abteilung und aktueller Einteilung."}</p></div>
      ${add}
      <div class="chip-rows" id="m-chips">${chipsHtml(s)}</div>
      <div class="m-tools">
        <label class="field grow" for="m-q">Suchen<input id="m-q" type="search" placeholder="Name eingeben" value="${esc(ui.mq)}" autocomplete="off" spellcheck="false"></label>
        <label class="field" for="m-rank">Rang<select id="m-rank"><option value="">Alle Ränge</option>${RANKS.map((r) => `<option value="${esc(r)}"${ui.mrank === r ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></label>
        <label class="field" for="m-dept">Abteilung<select id="m-dept"><option value="">Alle Abteilungen</option><option value="-"${ui.mdept === "-" ? " selected" : ""}>Ohne Abteilung</option>${DEPTS.map((d) => `<option value="${esc(d)}"${ui.mdept === d ? " selected" : ""}>${esc(d)}</option>`).join("")}</select></label>
        <label class="field" for="m-assign">Einteilung<select id="m-assign"><option value="">Alle</option><option value="yes"${ui.massign === "yes" ? " selected" : ""}>Eingeteilt</option><option value="no"${ui.massign === "no" ? " selected" : ""}>Nicht eingeteilt</option></select></label>
        <label class="field" for="m-sort">Sortierung<select id="m-sort"><option value="rank"${ui.msort === "rank" ? " selected" : ""}>Nach Rang</option><option value="name"${ui.msort === "name" ? " selected" : ""}>Nach Name</option></select></label>
      </div>
      <div id="m-list">${memberListHtml(s)}</div>
    </section>`;
  }

  function updateMembersList() {
    const s = cur();
    const list = document.getElementById("m-list");
    if (list) list.innerHTML = memberListHtml(s);
    const ch = document.getElementById("m-chips");
    if (ch) ch.innerHTML = chipsHtml(s);
    const r = document.getElementById("m-rank");
    if (r) r.value = ui.mrank;
    const d = document.getElementById("m-dept");
    if (d) d.value = ui.mdept;
  }

  // Nur das Fenster (Modal) neu zeichnen, ohne die Tabellen anzufassen
  function renderModal() {
    mroot.innerHTML = modalHtml();
    if (!ui.modal) return;
    const ta = document.getElementById("copy-area");
    if (ta) { ta.focus(); ta.select(); } else { const f = mroot.querySelector("[data-autofocus]"); if (f) f.focus(); }
  }

  // Nur "Im Dienst" und die Melde-Leiste neu zeichnen
  function renderDuty() {
    const slot = document.getElementById("duty-slot"), su = document.getElementById("su-slot");
    if (slot) slot.innerHTML = dutyHtml(cur());
    if (su) su.innerHTML = signupBarHtml();
    if (ui.modal && (ui.modal.signout)) renderModal();
  }

  function render() {
    comboClose();
    if (!ui.loading) {
      if (ui.tab === "members" && !canMembersTab()) ui.tab = "plan";
      if (ui.tab === "admin" && !isAdmin()) ui.tab = "plan";
      if (ui.tab === "bracket" && !isAdmin()) ui.tab = "plan";
    }
    document.body.classList.toggle("no-export", !can("export"));
    if (ui.loading && !ui.editing) { view.innerHTML = bannerHtml() + '<main class="wrap main"><p class="empty">Lädt …</p></main>'; renderModal(); return; }
    if (gateOn()) {
      document.body.classList.remove("is-editing");
      view.innerHTML = gateHtml();
      renderModal();
      const f = view.querySelector("[data-autofocus]"); if (f && !ui.modal) f.focus();
      return;
    }
    const s = cur();
    computeMarks(s);
    document.body.classList.toggle("is-editing", ui.editing);
    const sy = window.scrollY;
    view.innerHTML = bannerHtml() + tabsHtml(s)
      + `<main class="wrap main">${statusHtml(s)}${noticeHtml()}${ui.tab === "members" ? membersHtml(s) : ui.tab === "admin" ? adminHtml() : ui.tab === "bracket" ? '<div id="bt-root"></div>' : `<div id="su-slot">${signupBarHtml()}</div>` + planHtml(s)}</main>`
      + (ui.editing ? savebarHtml() + datalistHtml(s) : "");
    // frisch gezeichnete Kacheln sollen nicht an ihren Platz "fliegen"
    const bd = document.getElementById("board");
    if (bd) { bd.classList.add("noanim"); requestAnimationFrame(() => requestAnimationFrame(() => bd.classList.remove("noanim"))); }
    updateSavebar();
    layoutBoard();
    if (ui.tab === "bracket" && window.SunaBracket) window.SunaBracket.mount();
    if (Math.abs(window.scrollY - sy) > 1) window.scrollTo(0, sy);
    renderModal();
    if (ui.modal) { /* Fokus liegt im Fenster */ }
    else if (ui.focusAfter) { const f = document.getElementById(ui.focusAfter); ui.focusAfter = null; if (f) f.focus(); }
    else if (ui.newTable && ui.tab === "plan") { const f = document.getElementById("new-table-name"); if (f) f.focus(); }
    if (ui.tab === "admin" && !ui.adm && !ui.admBusy) loadAdmin();
  }

  function updateSavebar() {
    const p = document.getElementById("save-state");
    const b = app.querySelector('[data-act="save"]');
    if (!p || !b) return;
    const d = dirty();

  function snap() {
    if (!ui.editing) return;

  function undo() {
    if (!ui.editing) return;
    const now = JSON.stringify(ui.draft);
    while (ui.hist.length) {
      const j = ui.hist.pop();
      if (j !== now) { ui.draft = normalize(JSON.parse(j)); persistSoon(); render(); toast("Letzten Schritt rückgängig gemacht."); return; }
    }
    updateSavebar();
    toast("Es gibt nichts mehr rückgängig zu machen.");

  function startEdit(data) {

    if (!can("plan.edit") && can("members.edit")) ui.tab = "members";

  function setQty(n) {

  function confirmModal(m) { ui.modal = m; renderModal(); }
  function done(msg) { persistSoon(); render(); if (msg) toast(msg); }

  function act(name) {
    if (!ui.editing) return;
    const t = ui.draft.tables.find((x) => x.id === ui.sel) || ui.draft.tables[0];
    const n = ui.qty;
    if (name !== "clear" && name !== "table-del") snap();
    switch (name) {
      case "trupp+":
        for (let i = 0; i < n; i++) t.trupps.push(emptyTrupp(t.trupps.length + 1, t.rows));
        return done(`${plural(n, "Trupp", "Trupps")} zu „${tname(t)}“ hinzugefügt.`);
      case "trupp-": {
        const k = Math.min(n, t.trupps.length - 1);
        if (!k) return toast(`„${tname(t)}“ hat nur noch einen Trupp. Einer muss bleiben.`);
        t.trupps.splice(t.trupps.length - k, k);
        return done(`${plural(k, "Trupp", "Trupps")} aus „${tname(t)}“ entfernt.`);
      }
      case "member+": {
        const k = Math.min(n, MAX_ROWS - t.rows);
        if (!k) return toast(`„${tname(t)}“ hat schon ${MAX_ROWS} Mitgliederzeilen.`);
        t.rows += k;
        t.trupps.forEach((tr) => { for (let i = 0; i < k; i++) tr.members.push(""); });
        return done(`${plural(k, "Mitgliederzeile", "Mitgliederzeilen")} zu „${tname(t)}“ hinzugefügt.`);
      }
      case "member-": {
        const k = Math.min(n, t.rows - 1);
        if (!k) return toast(`„${tname(t)}“ hat nur noch eine Mitgliederzeile. Eine muss bleiben.`);
        t.rows -= k;
        t.trupps.forEach((tr) => { tr.members.length = t.rows; });
        return done(`${plural(k, "Mitgliederzeile", "Mitgliederzeilen")} aus „${tname(t)}“ entfernt.`);
      }
      case "clear":
        return confirmModal({
          title: `„${tname(t)}“ leeren?`,
          text: "Alle Truppführer und Mitglieder dieser Tabelle werden entfernt. Schichten und Trupp-Namen bleiben stehen.",
          ok: "Leeren",
          run: () => { snap(); t.trupps.forEach((tr) => { tr.tf = ""; tr.members = tr.members.map(() => ""); }); done(`„${tname(t)}“ geleert.`); }
        });
      case "table-del":
        if (ui.draft.tables.length <= 1) return toast("Eine Tabelle muss bleiben.");
        return confirmModal({
          title: `„${tname(t)}“ entfernen?`,
          text: "Die Tabelle wird mit allen Einträgen gelöscht.",
          ok: "Entfernen",
          run: () => { snap(); ui.draft.tables = ui.draft.tables.filter((x) => x !== t); ui.sel = ui.draft.tables[0].id; done(`„${tname(t)}“ entfernt.`); }
        });
      case "layout-reset":
        ui.draft.layout = {};
        return done("Anordnung zurückgesetzt. Die Kacheln ordnen sich automatisch an.");
      case "table-up":
      case "table-down": {
        const idx = ui.draft.tables.indexOf(t);
        const j = name === "table-up" ? idx - 1 : idx + 1;
        if (j < 0 || j >= ui.draft.tables.length) return;
        ui.draft.tables.splice(idx, 1);
        ui.draft.tables.splice(j, 0, t);
        done(`„${tname(t)}“ verschoben.`);
        const card = document.getElementById("tab-" + t.id);
        if (card) card.scrollIntoView({ behavior: "auto", block: "nearest" });
        return;
      }
      case "slot+":
        ui.draft.training.push({ time: "", trupp: "" });
        return done("Trainingszeit hinzugefügt.");
      case "slot-":
        if (ui.draft.training.length <= 1) return toast("Eine Trainingszeit muss bleiben.");
        ui.draft.training.pop();
        return done("Letzte Trainingszeit entfernt.");
    }
  }

  function addMember() {
    if (!ui.editing) return;
    const rankSel = document.getElementById("m-new-rank");
    const deptSel = document.getElementById("m-new-dept");
    if (ui.bulk) {
      const ta = document.getElementById("m-new-names");

      if (!lines.length) { toast("Trag mindestens einen Namen ein, einen pro Zeile."); if (ta) ta.focus(); return; }
      const rank = rankSel && RANKS.includes(rankSel.value) ? rankSel.value : "Rekrut";
      const dept = deptSel && DEPTS.includes(deptSel.value) ? deptSel.value : "";
      const have = new Set(ui.draft.members.map((mm) => fold(mm.name)));
      snap();
      let added = 0, skipped = 0;
      lines.forEach((name, i) => {
        const k = fold(name);
        if (have.has(k)) { skipped++; return; }
        have.add(k);
        ui.draft.members.push({ id: "m" + Date.now().toString(36) + i + Math.random().toString(36).slice(2, 5), name, rank, dept });
        added++;
      });
      ui.newRank = rank;
      ui.newDept = dept;
      ui.focusAfter = "m-new-names";
      return done(`${plural(added, "Mitglied", "Mitglieder")} hinzugefügt${skipped ? `, ${skipped} übersprungen (schon in der Liste)` : ""}.`);
    }
    const nameEl = document.getElementById("m-new-name");
    const name = (nameEl ? nameEl.value : "").trim().replace(/\s+/g, " ");
    if (!name) { toast("Gib zuerst einen Namen ein."); if (nameEl) nameEl.focus(); return; }
    if (ui.draft.members.some((mm) => fold(mm.name) === fold(name))) { toast(`„${name}“ steht schon in der Liste.`); if (nameEl) nameEl.focus(); return; }
    const rankEl = document.getElementById("m-new-rank");
    const deptEl = document.getElementById("m-new-dept");
    const rank = rankEl && RANKS.includes(rankEl.value) ? rankEl.value : "Rekrut";
    const dept = deptEl && DEPTS.includes(deptEl.value) ? deptEl.value : "";
    snap();
    ui.draft.members.push({ id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, rank, dept });
    ui.newRank = rank;
    ui.newDept = dept;
    ui.focusAfter = "m-new-name";
    done(`„${name}“ als ${rank} hinzugefügt.`);

  /* ---------- Speichern ---------- */
  let memTok = "";
  function getTok() { try { return localStorage.getItem(TOK_KEY) || memTok; } catch (e) { return memTok; } }
  function setTok(t) { memTok = t || ""; try { if (t) localStorage.setItem(TOK_KEY, t); else localStorage.removeItem(TOK_KEY); } catch (e) {} }

  // Alle Anfragen gehen als Funktionsaufruf an Supabase (suna_api in der Datenbank).
  // Antwort: { status, body } – genau wie früher bei api.php.
  async function api(action, body, query) {
    if (!SB_READY) return { status: 0, body: { message: "Die Seite ist noch nicht mit Supabase verbunden (config.js ausfüllen)." } };
    const payload = Object.assign({}, body || {});
    if (query) { const q = new URLSearchParams(query.replace(/^&/, "")); q.forEach((v, k) => { payload[k] = v; }); }
    const res = await fetch(SB_URL + "/rest/v1/rpc/suna_api", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", apikey: SB_KEY },
      body: JSON.stringify({ a: action, body: payload, tok: getTok() || null, guest: guestId() })
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || !data || typeof data.status !== "number") return { status: res.status || 0, body: { message: (data && data.message) || "Serverfehler" } };
    const out = data.body && typeof data.body === "object" ? data.body : {};
    if (action === "login" && data.status === 200 && out.token) { setTok(out.token); delete out.token; }
    if (action === "logout" || (data.status === 401 && out.error === "not_logged_in")) setTok("");
    return { status: data.status, body: out };
  }

  function applyServer(body) {
    if (body.data) { const d = normalize(body.data); d.updated = body.updated || null; saved = d; }
    else if (body.updated === null && ui.needView) saved = normalize(null);
    if (body.version !== undefined) ui.version = body.version || 0;
    if (body.me) { ui.me = Object.assign(GUEST_ME(), body.me); ui.meSig = JSON.stringify(body.me); }
    if (body.signups) ui.signups = body.signups;
    if (body.setup !== undefined) ui.setup = body.setup;
    if (body.duty_stats) ui.dutyStats = body.duty_stats;
    if (body.duty) { ui.duty = body.duty; ui.dutySig = body.duty_sig || ""; }
  }

  async function fetchSetup() {
    try { const r = await api("status"); ui.setup = r.status === 200 && r.body.konten === 0 ? (r.body.erster_admin || "admin") : false; } catch (e) {}
  }

  async function loadFromServer(first) {
    try {
      const r = await api("load");
      if (r.status === 401 && r.body.error === "login_required") {
        ui.serverOk = true; ui.loading = false; ui.needView = true;
        ui.me = GUEST_ME(); ui.meSig = ""; ui.signups = [];
        saved = normalize(null);
        await fetchSetup();
        render();
        return false;
      }
      if (r.status !== 200) throw new Error(r.body.message || "Serverfehler");
      ui.serverOk = true; ui.loading = false; ui.needView = false;
      applyServer(r.body);
      if (ui.me.user) ui.forceGate = false;
      if (!ui.editing || gateOn()) render();
      return true;
    } catch (e) {
      ui.loading = false; ui.serverOk = false;
      if (first) ui.notice = { text: "Der Server ist gerade nicht erreichbar" + (e && e.message && e.message !== "Failed to fetch" ? ` (${e.message})` : "") + ". Lade die Seite gleich noch einmal.", actions: [["close", "OK"]] };
      if (!ui.editing) render();
      return false;
    }
  }

    const btn = document.getElementById("gate-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Prüfe …"; }
    ui.gateUser = name;
    let r;
    try { r = await api("login", { username: name, password: pw }); }
    catch (e) { ui.gateErr = "Keine Verbindung zum Server."; return render(); }
    if (r.status === 200) {
      ui.gateErr = ""; ui.gateUser = ""; ui.forceGate = false; ui.needView = false; ui.guestOk = false; ui.adm = null; ui.setup = false;
      try { sessionStorage.removeItem(GUEST_KEY); } catch (e) {}
      await loadFromServer();
      render();
      toast("Angemeldet als " + (r.body.username || name) + ".");
      return;
    }
    ui.gateErr = r.status === 429 ? `Zu viele Fehlversuche. Versuch es in ${Math.ceil((r.body.wait || 900) / 60)} Minuten noch einmal.`
      : r.body.message || "Anmelden hat nicht geklappt.";
    render();
    const pwEl = document.getElementById("gate-pw"); if (pwEl) pwEl.focus();
  }

  /* ---------- Raster: Kacheln anordnen und verschieben ---------- */
  const GAP = 16, ROW = 8;
  const FLOW_MQ = window.matchMedia("(max-width: 820px)");
  const grid = { el: null, colW: 0, items: [], drag: null, sig: "", raf: 0 };
  const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

  // "Schwerkraft": Kacheln rutschen nach oben, bis etwas im Weg ist. Die bewegte Kachel (fixedId) wird zuerst an ihren Zielplatz gesetzt.
  function settle(items, fixedId, fx, fy) {
    const list = items.map((i) => ({ id: i.id, w: i.w, h: i.h, x: i.x, y: i.y }));
    const mv = fixedId ? list.find((i) => i.id === fixedId) : null;
    const placed = [];
    if (mv) { mv.x = clamp(fx, 0, COLS - mv.w); mv.y = Math.max(0, fy); placed.push(mv); }
    list.filter((i) => i !== mv).sort((a, b) => a.y - b.y || a.x - b.x).forEach((it) => {
      it.x = clamp(it.x, 0, COLS - it.w);
      let y = 0, c;
      while ((c = placed.find((p) => hit({ x: it.x, y, w: it.w, h: it.h }, p)))) y = c.y + c.h;
      it.y = y;
      placed.push(it);
    });
    return list;
  }
  // Reihenweise nebeneinander legen (für Kacheln ohne gespeicherten Platz)
  function shelf(list, y0) {
    let x = 0, y = y0, rowH = 0;
    list.forEach((it) => {
      if (x + it.w > COLS) { x = 0; y += rowH; rowH = 0; }
      it.x = x; it.y = y; x += it.w; rowH = Math.max(rowH, it.h);
    });
  }
  const boardCards = (el) => Array.from(el.querySelectorAll(":scope > [data-card]"));
  const boardSig = () => { const el = document.getElementById("board"); return el ? el.clientWidth + "|" + boardCards(el).map((c) => c.offsetHeight).join(",") : ""; };
  const scheduleLayout = () => { cancelAnimationFrame(grid.raf); grid.raf = requestAnimationFrame(layoutBoard); };
  const ro = typeof ResizeObserver === "function" ? new ResizeObserver(() => { if (!grid.drag && boardSig() !== grid.sig) scheduleLayout(); }) : null;

  function applyPositions(list, skipId) {
    let bottom = 0;
    list.forEach((it) => {
      const g = grid.items.find((x) => x.id === it.id);
      if (g && it.id !== skipId) { g.el.style.left = it.x * (grid.colW + GAP) + "px"; g.el.style.top = it.y * ROW + "px"; }
      bottom = Math.max(bottom, it.y + it.h);
    });
    grid.el.style.height = Math.max(0, bottom * ROW - GAP) + "px";
  }

  function layoutBoard() {
    const el = document.getElementById("board");
    grid.el = el;
    if (ro) ro.disconnect();
    if (!el || grid.drag) return;
    const cards = boardCards(el);
    if (FLOW_MQ.matches || !cards.length || el.clientWidth < 300) {
      el.classList.add("flow"); el.classList.remove("grid"); el.style.height = "";
      cards.forEach((c) => { c.style.left = c.style.top = c.style.width = ""; });
      grid.items = []; grid.sig = "";
      return;
    }
    el.classList.remove("flow"); el.classList.add("grid");
    const colW = (el.clientWidth - (COLS - 1) * GAP) / COLS;
    grid.colW = colW;
    // 1) Breite in Spalten aus der Anzahl der Trupps bzw. Zeiten (gleich im Ansehen und Bearbeiten), 2) Höhe messen
    const sd = cur();
    const count = (id) => (id === "training" ? sd.training.length : ((sd.tables.find((t) => t.id === id) || { trupps: [] }).trupps.length));
    cards.forEach((c) => { c.style.left = "0px"; c.style.top = "0px"; });
    const items = cards.map((c) => {
      const px = Math.max(116 + count(c.dataset.card) * 190, 400);
      const w = clamp(Math.ceil((px + GAP) / (colW + GAP)), 2, COLS);
      c.style.width = w * colW + (w - 1) * GAP + "px";
      return { id: c.dataset.card, el: c, w, h: 1, x: 0, y: 0 };
    });
    items.forEach((it) => { it.h = Math.ceil((it.el.offsetHeight + GAP) / ROW); });
    // 3) Plätze: gespeicherte Anordnung, neue Kacheln unten anreihen
    const lay = cur().layout || {};
    const known = items.filter((it) => lay[it.id]);
    known.forEach((it) => { it.x = lay[it.id].x; it.y = lay[it.id].y; });
    shelf(items.filter((it) => !lay[it.id]), known.reduce((m, it) => Math.max(m, it.y + it.h), 0));
    const out = settle(items, null);
    grid.items = items.map((it) => Object.assign(it, out.find((o) => o.id === it.id)));
    applyPositions(grid.items, null);
    grid.sig = boardSig();
    if (ro) cards.forEach((c) => ro.observe(c));
  }

  function commitLayout(res) {
    if (!EP()) return false;
    const lay = {};
    res.forEach((i) => { lay[i.id] = { x: i.x, y: i.y }; });
    if (JSON.stringify(lay) === JSON.stringify(ui.draft.layout || {})) return false;
    snap();
    ui.draft.layout = lay;
    persistSoon();
    return true;
  }

  const ghostPlace = (it) => {
    const d = grid.drag;
    if (!d || !it) return;
    d.ghost.style.left = it.x * (grid.colW + GAP) + "px";
    d.ghost.style.top = it.y * ROW + "px";
    d.ghost.style.width = it.w * grid.colW + (it.w - 1) * GAP + "px";
    d.ghost.style.height = it.h * ROW - GAP + "px";
  };

  function dragStart(id, e) {
    const it = grid.items.find((x) => x.id === id);
    if (!it || grid.drag) return;
    const ghost = document.createElement("div");
    ghost.className = "drop-ghost";
    grid.el.insertBefore(ghost, grid.el.firstChild);
    grid.drag = { id, it, el: it.el, ghost, sx: e.clientX, sy: e.clientY + window.scrollY, lx: e.clientX, ly: e.clientY, l0: it.el.offsetLeft, t0: it.el.offsetTop, cx: it.x, cy: it.y, res: grid.items, moved: false, timer: 0 };
    it.el.classList.add("dragging");
    grid.el.classList.add("is-dragging");
    ghostPlace(it);
    document.addEventListener("pointermove", dragMove);
    document.addEventListener("pointerup", dragUp);
    document.addEventListener("pointercancel", dragCancel);
    document.addEventListener("keydown", dragKey, true);
    grid.drag.timer = setInterval(dragScroll, 30);
  }
  function dragUpdate() {
    const d = grid.drag;
    if (!d) return;
    const bw = grid.el.clientWidth;
    const left = clamp(d.l0 + (d.lx - d.sx), 0, Math.max(0, bw - d.el.offsetWidth));
    const top = Math.max(0, d.t0 + (d.ly + window.scrollY - d.sy));
    d.el.style.left = left + "px";
    d.el.style.top = top + "px";
    const cx = Math.round(left / (grid.colW + GAP));
    const cy = Math.round(top / ROW);
    if (cx === d.cx && cy === d.cy) return;
    d.cx = cx; d.cy = cy; d.moved = true;
    d.res = settle(settle(grid.items, d.id, cx, cy), null);
    applyPositions(d.res, d.id);
    ghostPlace(d.res.find((i) => i.id === d.id));
  }
  function dragMove(e) { const d = grid.drag; if (!d) return; d.lx = e.clientX; d.ly = e.clientY; dragUpdate(); }
  function dragScroll() {
    const d = grid.drag;
    if (!d) return;
    const edge = 80;
    if (d.ly < edge) window.scrollBy(0, -Math.ceil((edge - d.ly) / 4));
    else if (d.ly > window.innerHeight - edge) window.scrollBy(0, Math.ceil((d.ly - (window.innerHeight - edge)) / 4));
    else return;
    dragUpdate();
  }
  function dragFinish() {
    const d = grid.drag;
    clearInterval(d.timer);
    document.removeEventListener("pointermove", dragMove);
    document.removeEventListener("pointerup", dragUp);
    document.removeEventListener("pointercancel", dragCancel);
    document.removeEventListener("keydown", dragKey, true);
    d.el.classList.remove("dragging");
    grid.el.classList.remove("is-dragging");
    d.ghost.remove();
    grid.drag = null;
    return d;
  }
  function dragUp() { const d = dragFinish(); if (d.moved) commitLayout(d.res); render(); }
  function dragCancel() { dragFinish(); render(); }
  function dragKey(e) { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); dragCancel(); } }

  // Pfeiltasten auf dem Griff: Kachel um eine Spalte oder nach oben/unten schieben
  function nudge(id, dx, dy) {
    const it = grid.items.find((x) => x.id === id);
    if (!it) return;
    const ty = dy < 0 ? Math.max(0, it.y - 4) : dy > 0 ? it.y + it.h : it.y;
    commitLayout(settle(settle(grid.items, id, it.x + dx, ty), null));
    ui.focusAfter = "grip-" + id;
    render();
  }

  app.addEventListener("pointerdown", (e) => {
    const g = e.target.closest && e.target.closest(".grip");
    if (!g || !EP() || (e.button || 0) !== 0 || !grid.el || !grid.el.classList.contains("grid")) return;
    e.preventDefault();
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    dragStart(g.dataset.drag, e);
  });
  app.addEventListener("keydown", (e) => {
    const g = e.target.closest && e.target.closest(".grip");
    if (!g || !EP() || grid.drag || !grid.el || !grid.el.classList.contains("grid")) return;
    const dx = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
    const dy = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
    if (!dx && !dy) return;
    e.preventDefault();
    nudge(g.dataset.drag, dx, dy);
  });
  window.addEventListener("resize", () => { if (!grid.drag && boardSig() !== grid.sig) scheduleLayout(); });
  if (FLOW_MQ.addEventListener) FLOW_MQ.addEventListener("change", () => { grid.sig = ""; scheduleLayout(); });

  window.addEventListener("beforeunload", (e) => { if (dirty() && !ui.saving) { e.preventDefault(); e.returnValue = ""; } });

  window.SUNA_APP = { sb: { get url() { return SB_URL; }, get key() { return SB_KEY; }, get ready() { return SB_READY; } }, getTok, sessionLost, isAdmin, toast, members: () => (cur().members || []).map((m) => m.name).filter(Boolean), user: () => (ui.me.user ? String(ui.me.user.id) : "") };

  /* ---------- Start ---------- */
  render();
  loadFromServer(true).then((ok) => {
    const st = readStash();
    if (!ok || !st || !st.data) return;
    if (JSON.stringify(normalize(st.data)) === savedJson()) return clearStash();
    ui.notice = {
      text: "Auf diesem Gerät gibt es noch ungespeicherte Änderungen aus deiner letzten Sitzung. Wenn du sie wiederherstellst und speicherst, ersetzen sie den aktuellen Stand.",
      actions: [["restore", "Änderungen wiederherstellen"], ["dismiss", "Verwerfen"]],
      data: st.data
    };
    render();
  });

  // Änderungen anderer: "check" bzw. die Warteverbindung melden, was neu ist
  async function handleCheck(body) {
    if (!ui.serverOk) { ui.serverOk = true; if (!ui.editing) render(); }
    const meChanged = !!body.me && JSON.stringify(body.me) !== ui.meSig;
    const verChanged = (body.version || 0) !== ui.version;
    const dutyChanged = body.duty_sig !== undefined && body.duty_sig !== ui.dutySig;
    if (!meChanged && !verChanged && !dutyChanged) return;
    if (dutyChanged && !meChanged && !verChanged) return refreshDuty(body.duty ? body : null);
    if (ui.editing) {
      if (verChanged && !ui.remoteNoted) { ui.remoteNoted = true; toast("Jemand anderes hat gerade gespeichert. Beim Speichern kannst du wählen, welche Version gilt."); }
      if (dutyChanged) refreshDuty(body.duty ? body : null);
      return;
    }
    const act = document.activeElement;
    if (ui.modal || (act && app.contains(act) && /^(INPUT|SELECT|TEXTAREA)$/.test(act.tagName))) { if (dutyChanged) refreshDuty(body.duty ? body : null); return; }
    if (await loadFromServer()) { if (verChanged) toast("Der Plan wurde gerade aktualisiert."); else if (meChanged && ui.me.user) toast("Deine Rechte wurden aktualisiert."); }
  }
  async function syncNow(pushed) {
    if (document.hidden || ui.saving || ui.needView || ui.loading || gateOn() || (!pushed && Date.now() - lastAct > 900000)) return;
    let r;
    try { r = await api("check"); } catch (e) { if (ui.serverOk) { ui.serverOk = false; if (!ui.editing) render(); } return; }
    if (r.status !== 200) return;
    return handleCheck(r.body);
  }
  // Sofort-Aktualisierung: Supabase Realtime meldet jede Änderung ("Klingel"), dann wird sofort nachgeladen.
  // Ohne Realtime (oder bei Ausfall) fragt die Seite wie früher ab: alle ~30 Sekunden, bei Inaktivität seltener.
  let rtOn = false, rtTimer = 0;
  function rtPing() { clearTimeout(rtTimer); rtTimer = setTimeout(() => { syncNow(true); }, Math.random() * 300); }
  function startRealtime() {
    if (!SB_READY || !/supabase\.co$/i.test(SB_URL)) return;
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
    sc.async = true;
    sc.onload = () => {
      try {
        const c = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        c.channel("suna-pulse")
          .on("postgres_changes", { event: "UPDATE", schema: "public", table: "suna_pulse" }, rtPing)
          .subscribe((st) => { const was = rtOn; rtOn = st === "SUBSCRIBED"; if (rtOn && !was) syncNow(true); });
      } catch (e) { rtOn = false; }
    };
    sc.onerror = () => { rtOn = false; };
    document.head.appendChild(sc);
  }
  startRealtime();
  let lastAct = Date.now();
  const markActive = () => { const was = Date.now() - lastAct; lastAct = Date.now(); if (was > 180000) syncNow(); };
  ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, markActive, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { markActive(); syncNow(); } });
  (function tick() {
    const idle = Date.now() - lastAct;
    const base = rtOn ? 180000 : (idle > 180000 ? 120000 : POLL_MS);
    setTimeout(async () => { await syncNow(); tick(); }, base * (0.85 + Math.random() * 0.3));
  })();
})();
</script>
